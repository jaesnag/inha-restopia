<!DOCTYPE html>

  <style>
    :root {
      --brand-green: #12503D;
      --brand-green-dark: #0D3D2E;
      --brand-green-soft: #E8F2EE;
      --bg-sage: #F4F6F3;
      --surface: #FFFFFF;
      --text-main: #1A2420;
      --text-sub: #5F6F68;
      --border-soft: #E2E8E4;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #E3E8E4;
      color: var(--text-main);
      height: 100%;
    }

    .app-viewport {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    @media (min-width: 520px) {
      .app-viewport { padding: 16px; }
      .mobile-shell {
        max-width: 420px;
        height: 856px;
        max-height: calc(100vh - 32px);
        border-radius: 36px;
        box-shadow: 0 24px 60px rgba(13, 61, 46, 0.22), 0 0 0 8px #1E2823;
        overflow: hidden;
      }
    }

    .mobile-shell {
      width: 100%;
      height: 100vh;
      background-color: var(--bg-sage);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .scroll-area::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    @keyframes pulseSoft {
      0%, 100% { opacity: 0.72; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-2px); }
    }
    .pulse-soft { animation: pulseSoft 2.2s ease-in-out infinite; }

    @keyframes pingLocation {
      0% { transform: scale(1); opacity: 0.65; }
      75%, 100% { transform: scale(2.1); opacity: 0; }
    }
    .location-ping { animation: pingLocation 1.8s cubic-bezier(0, 0, 0.2, 1) infinite; }

    @keyframes dashMove {
      to { stroke-dashoffset: -24; }
    }
    .route-dash {
      stroke-dasharray: 6 6;
      animation: dashMove 0.9s linear infinite;
    }

    @keyframes scanLine {
      0%, 100% { top: 12%; }
      50% { top: 82%; }
    }
    .qr-scan-line { animation: scanLine 2.1s ease-in-out infinite; }

    .room-tile {
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
      user-select: none;
    }
    .room-tile:active { transform: scale(0.97); }
    .room-tile.selected {
      box-shadow: 0 0 0 2.5px var(--brand-green), 0 6px 14px rgba(18, 80, 61, 0.16);
      z-index: 5;
    }

    .toast-enter { animation: toastIn 0.22s ease-out forwards; }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>

    function loadPersistedState() {

        const raw = localStorage.getItem(STORAGE_KEY);

        const saved = JSON.parse(raw);
        if (saved.user) state.user = { ...state.user, ...saved.user };
        if (Array.isArray(saved.favorites)) state.favorites = saved.favorites;
        if (Array.isArray(saved.alertSpaceIds)) state.alertSpaceIds = saved.alertSpaceIds;
        if (Array.isArray(saved.timetable) && saved.timetable.length > 0) state.timetable = saved.timetable;
        if (Array.isArray(saved.spaces) && saved.spaces.length === INITIAL_SPACES.length) {
          state.spaces = saved.spaces;
        }
        if (saved.activeCheckIn) {
          state.activeCheckIn = saved.activeCheckIn;
          // 데이터 일관성 확보: 체크인된 공간의 점유 좌석이 최소 1 이상인지 검증
          const sp = getSpaceById(saved.activeCheckIn.spaceId);
          if (sp) {
            if (sp.occupiedSeats < 1) sp.occupiedSeats = 1;
            state.myLocationId = sp.id;
            state.arrivedAtRestopia = true;
          } else {
            state.activeCheckIn = null;
          }
        }
        if (typeof saved.freeTimeSeconds === 'number') state.freeTimeSeconds = saved.freeTimeSeconds;
      } catch (e) {
        // Ignore storage errors
      }
    }

    // ==================== TIME & TIMETABLE AUTO-DISCOVERY ====================
    function toMinutes(hhmm) {
      const [h, m] = (hhmm || '00:00').split(':').map(n => parseInt(n, 10) || 0);
      return h * 60 + m;
    }

    function getCurrentReferenceMinutes() {
      if (state.useRealClock) {
        const d = new Date();
        return d.getHours() * 60 + d.getMinutes();
      }
      return toMinutes(state.simClockHM);
    }

    // 현재 시간 기준 자동 탐색: 가장 최근 끝난 수업과 다가오는 다음 수업 자동 계산
    function getTimetableContext() {
      const sorted = [...state.timetable].sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
      const nowMin = getCurrentReferenceMinutes();
      let prevClass = null;
      let nextClass = null;
      for (const cls of sorted) {
        if (toMinutes(cls.endTime) <= nowMin) {
          prevClass = cls;
        } else if (toMinutes(cls.startTime) > nowMin && !nextClass) {
          nextClass = cls;
        }
      }
      if (!nextClass) {
        nextClass = sorted[sorted.length - 1] || { name: '자율 학습', startTime: '18:00', building: '정석학술정보관', walkMin: 5 };
      }
      const diffMin = Math.max(5, toMinutes(nextClass.startTime) - nowMin);
      return { prevClass, nextClass, diffMin };
    }

    function syncFreeTimeFromTimetable() {
      const ctx = getTimetableContext();
      state.freeTimeSeconds = ctx.diffMin * 60;
      state.totalGapSeconds = ctx.diffMin * 60;
    }

    // ==================== GPS DISTANCE (HAVERSINE) ====================
    function calcDistanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function updateUserCoordinates(lat, lng) {
      state.userCoords = { lat, lng };
      state.distanceMeters = calcDistanceMeters(lat, lng, RESTOPIA_COORDS.lat, RESTOPIA_COORDS.lng);
      if (state.distanceMeters <= ARRIVAL_RADIUS_METERS && !state.arrivedAtRestopia) {
        handleGpsArrivalDetected();
      }
    }

    // ==================== CONTEXT-AWARE UX MODE RESOLVER ====================
    // 5가지 상황 인지형 UX 모드: 'class_prep' | 'resting' | 'arrived' | 'moving' | 'free_start'
    function getContextMode() {
      const freeMin = getFreeMinutes();
      if (state.activeCheckIn) {
        if (freeMin <= state.user.classAlertBeforeMin) return 'class_prep';
        return 'resting';
      }
      if (state.arrivedAtRestopia) return 'arrived';
      if (state.movingToSpaceId) return 'moving';
      return 'free_start';
    }

    // ==================== HELPERS & NOTIFICATIONS ====================
    function formatTimeNow() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
    }

    function formatClockHM() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function getFreeMinutes() {
      return Math.max(0, Math.ceil(state.freeTimeSeconds / 60));
    }

    function formatCountdown(sec) {
      const s = Math.max(0, sec);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}분 ${String(r).padStart(2, '0')}초`;
    }

      if (state.toastTimer) clearTimeout(state.toastTimer);
      state.toast = message;
      render();
      state.toastTimer = setTimeout(() => {
        state.toast = null;
        const toastEl = document.getElementById('app-toast');
        if (toastEl) toastEl.remove();
      }, 2800);
    }

    // 스마트폰(브라우저 Web Notification API) 연동 알림
    function sendPushNotification(title, body) {
      if (state.user.pushConsent && 'Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(title, { body });
        } catch (e) {
          // Fallback to in-app notification silently
        }
      }
    }

    function requestPushPermission() {
      if (!('Notification' in window)) {
        showToast('현재 브라우저는 시스템 알림을 지원하지 않아 앱 내 알림으로 표시됩니다.');
        return;
      }
      Notification.requestPermission().then(perm => {
        state.user.pushConsent = perm === 'granted';
        savePersistedState();
        if (perm === 'granted') {
          sendPushNotification('휴토피아 알림 연동 완료', '빈자리 및 다음 수업 알림을 스마트폰으로 받을 수 있어요.');
          showToast('스마트폰 알림 연동이 활성화되었어요!');
        } else {
          showToast('알림 권한이 거부되어 앱 내 알림함으로 안내해 드려요.');
        }
      });
    }

    function addNotification(title, body, targetTab = 'map', targetSpaceId = null) {
      state.notifications.unshift({
        id: 'n_' + Date.now(),
        title,
        body,
        time: '방금 전',
        targetTab,
        targetSpaceId,
        unread: true
      });
      if (state.notifications.length > 15) state.notifications.pop();
      sendPushNotification(title, body);
    }

    function getSpaceById(id) { return state.spaces.find(s => s.id === id); }
    function getLocationCoords(locId) {
      if (locId === 'entrance') return ENTRANCE_POS.center;
      const sp = getSpaceById(locId);
      return sp ? sp.center : ENTRANCE_POS.center;
    }
    function getVacancy(space) { return Math.max(0, space.totalSeats - space.occupiedSeats); }
    function getTotalSeatsStats() {
      const total = state.spaces.reduce((acc, s) => acc + s.totalSeats, 0);
      const vacant = state.spaces.reduce((acc, s) => acc + getVacancy(s), 0);
      return { total, vacant };
    }
    function getCongestion(space) {
      const vac = getVacancy(space);
      if (vac === 0) return { label: '혼잡', key: 'full', text: '만석' };
      const ratio = vac / space.totalSeats;
      if (ratio >= 0.5) return { label: '여유', key: 'avail', text: `빈자리 ${vac}석` };
      return { label: '보통', key: 'mod', text: `빈자리 ${vac}석` };
    }
    function getWalkMinutes(targetSpaceId) {
      if (state.myLocationId === targetSpaceId) return 0;
      const sp = getSpaceById(targetSpaceId);
      if (!sp) return 2;
      if (state.myLocationId === 'entrance') return sp.baseWalkMin;
      const from = getLocationCoords(state.myLocationId);
      const dist = Math.hypot(sp.center.x - from.x, sp.center.y - from.y);
      return Math.max(1, Math.min(3, Math.round(dist / 35)));
    }
    function getAlternativeSpace(excludeId) {
      return state.spaces
        .filter(s => s.id !== excludeId && getVacancy(s) > 0)
        .sort((a, b) => getVacancy(b) - getVacancy(a))[0] || null;
    }
    function getFriendsInSpace(spaceId) {
      return state.friends.filter(f => f.shareAgreed && f.spaceId === spaceId);
    }
    function getStatusBadgeClasses(key) {
      if (key === 'avail') return 'bg-[#E7F5EE] text-[#16794C]';
      if (key === 'mod') return 'bg-[#FDF4E3] text-[#B86E14]';
      return 'bg-[#FDECEC] text-[#C93B3B]';
    }
    function getTileClasses(key) {
      if (key === 'avail') return 'bg-[#EBF6F0] border-[#86C9A6] text-[#12503D]';
      if (key === 'mod') return 'bg-[#FDF5E6] border-[#E8B968] text-[#6E4409]';
      return 'bg-[#FDEEEE] border-[#EE9B9B] text-[#9E2A2A]';
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('내 친구 코드가 복사되었습니다.')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        showToast('내 친구 코드가 복사되었습니다.');
      } catch (e) { showToast('복사에 실패했습니다.'); }
    }

    // ==================== CORE ACTIONS ====================
    function enterLogin() { state.screen = 'login'; render(); }
    function fillDemoLogin() {
      state.loginForm.studentId = '12240000';
      state.loginForm.name = '홍길동';
      state.loginForm.error = '';
      render();
    }
    function handleLoginSubmit(e) {
      e.preventDefault();
      const sid = state.loginForm.studentId.trim();
      const name = state.loginForm.name.trim();
      if (!/^\d{8}$/.test(sid)) { state.loginForm.error = '학번 8자리를 숫자로 정확히 입력해 주세요.'; render(); return; }
      if (!name) { state.loginForm.error = '이름을 입력해 주세요.'; render(); return; }
      state.user.studentId = sid;
      state.user.name = name;

      state.activeTab = 'home';

    function switchTab(tab) {
      stopQrCamera();
      state.screen = 'main';
      state.activeTab = tab;
      render();
    }

    function openSpaceOnMap(spaceId) {
      stopQrCamera();
      state.selectedSpaceId = spaceId;
      state.screen = 'main';
      state.activeTab = 'map';
      state.mapViewMode = 'map';
      state.detailExpanded = false;
      render();
    }

    function toggleFavorite(spaceId) {
      const sp = getSpaceById(spaceId);
      if (state.favorites.includes(spaceId)) {
        state.favorites = state.favorites.filter(id => id !== spaceId);
        showToast(`${sp.name} 찜하기를 해제했어요.`);
      } else {
        state.favorites.push(spaceId);
        if (!state.alertSpaceIds.includes(spaceId)) state.alertSpaceIds.push(spaceId);
        showToast(`${sp.name}을(를) 찜했어요!`);
      }
      savePersistedState();
    }

    function toggleAlert(spaceId) {
      const sp = getSpaceById(spaceId);
      if (state.alertSpaceIds.includes(spaceId)) {
        state.alertSpaceIds = state.alertSpaceIds.filter(id => id !== spaceId);
        showToast(`${sp.name} 빈자리 알림을 해제했어요.`);
      } else {
        state.alertSpaceIds.push(spaceId);
        showToast(`${sp.name} 빈자리가 나면 바로 알려드릴게요!`);
      }
      savePersistedState();
    }

    function setListFilter(filterKey) {
      state.listFilter = filterKey;
      const filtered = getFilteredSpaces();
      const labelMap = { all: '전체 공간', available: '빈자리 있는 공간', lie: '누워 쉴 수 있는 공간', quiet: '조용한 공간', favorites: '찜한 공간' };
      showToast(`${labelMap[filterKey]} ${filtered.length}곳`);
    }

    function getFilteredSpaces() {
      const sorted = [...state.spaces].sort((a, b) => getWalkMinutes(a.id) - getWalkMinutes(b.id));
      return sorted.filter(sp => {
        if (state.listFilter === 'available') return getVacancy(sp) > 0;
        if (state.listFilter === 'lie') return sp.categories.includes('lie');
        if (state.listFilter === 'quiet') return sp.categories.includes('quiet');
        if (state.listFilter === 'favorites') return state.favorites.includes(sp.id);
        return true;
      });
    }

    // 이동 모드 시작 (좌표 거리 점진 감소 + 휴토피아 도착 시 자동 도착 모드 전환)
    function startMoveToSpace(spaceId) {
      const sp = getSpaceById(spaceId);
      if (!sp) return;
      if (state.activeCheckIn && state.activeCheckIn.spaceId === spaceId) {
        checkoutRest();
        return;
      }
      if (getVacancy(sp) === 0) {
        showToast('현재 만석입니다. 대체 공간을 확인해 보세요.');
        return;
      }
      if (state.movingToSpaceId === spaceId) {
        clearInterval(state.moveTimer);
        state.moveTimer = null;
        state.movingToSpaceId = null;
        state.moveProgress = 0;
        showToast('이동을 취소했습니다.');
        return;
      }
      if (state.moveTimer) clearInterval(state.moveTimer);
      state.movingToSpaceId = spaceId;
      state.selectedSpaceId = spaceId;
      state.arrivedAtRestopia = false;
      state.moveProgress = 0;
      state.activeTab = 'home'; // 상황 인지형 이동 모드를 홈에서 즉시 확인!
      render();

      state.moveTimer = setInterval(() => {
        state.moveProgress += 25;
        // 거리를 실제 좌표 보간으로 점진 감소
        const ratio = Math.max(0, 1 - state.moveProgress / 100);
        const lat = RESTOPIA_COORDS.lat + 0.0018 * ratio;
        const lng = RESTOPIA_COORDS.lng;
        state.userCoords = { lat, lng };
        state.distanceMeters = calcDistanceMeters(lat, lng, RESTOPIA_COORDS.lat, RESTOPIA_COORDS.lng);

        if (state.moveProgress >= 100) {
          clearInterval(state.moveTimer);
          state.moveTimer = null;
          state.movingToSpaceId = null;
          state.moveProgress = 0;
          handleGpsArrivalDetected();
        } else {
          render();
        }
      }, 700);
    }

    // STEP 5: 위치·거리 기반 GPS 도착 감지 + 권한 동의 시 QR 자동 전환
    function requestGpsCheck() {
      if (state.user.gpsConsent === null) {
        state.modal = 'gpsConsent';
        render();
        return;
      }
      if (state.user.gpsConsent === 'granted' && navigator.geolocation) {
        showToast('현재 GPS 좌표와 휴토피아 간 거리를 계산하는 중...');
        navigator.geolocation.getCurrentPosition(
          pos => {
            const dist = calcDistanceMeters(pos.coords.latitude, pos.coords.longitude, RESTOPIA_COORDS.lat, RESTOPIA_COORDS.lng);
            state.userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            state.distanceMeters = dist;
            if (dist <= ARRIVAL_RADIUS_METERS) {
              handleGpsArrivalDetected();
            } else {
              showToast(`현재 휴토피아까지 ${dist}m 남았습니다. (${ARRIVAL_RADIUS_METERS}m 이내 도착 시 자동 실행)`);
            }
          },
          () => {
            // 실외 GPS 불가 시 가상 캠퍼스 거리 시뮬레이션
            updateUserCoordinates(RESTOPIA_COORDS.lat + 0.0001, RESTOPIA_COORDS.lng);
          },
          { timeout: 2500 }
        );
      } else {
        openQrScanner();
      }
    }

    function setGpsConsent(decision) {
      state.user.gpsConsent = decision;
      state.modal = null;
      savePersistedState();
      if (decision === 'granted') {
        requestGpsCheck();
      } else {
        showToast('위치 미동의 상태에서도 수동 QR 체크인을 이용할 수 있어요.');
      }
    }

    function handleGpsArrivalDetected() {
      state.arrivedAtRestopia = true;
      state.distanceMeters = 12;
      state.movingToSpaceId = null;
      if (state.moveTimer) { clearInterval(state.moveTimer); state.moveTimer = null; }
      const msg = '휴토피아 반경 35m 이내 도착! QR코드를 스캔해 주세요.';
      addNotification(msg, `${getSpaceById(state.selectedSpaceId).name} 앞 QR을 스캔하면 휴식이 시작돼요.`, 'qr', state.selectedSpaceId);

      // 권한 동의 시 별도 버튼 클릭 없이 QR 스캔 화면 자동 전환
      if (state.user.gpsConsent === 'granted') {
        showToast(msg);
        setTimeout(() => {
          openQrScanner();
        }, 700);
      } else {
        state.screen = 'main';
        state.activeTab = 'home';
        showToast(msg);
      }
      render();
    }

    // STEP 6: 실제 카메라 연동 + BarcodeDetector QR 인식
    function openQrScanner() {
      state.modal = null;
      state.qrResult = null;
      state.screen = 'qr';
      render();
      if (state.user.cameraConsent === 'granted') {
        startQrCameraStream();
      }
    }

    function stopQrCamera() {
      if (qrScanInterval) { clearInterval(qrScanInterval); qrScanInterval = null; }
      if (cameraMediaStream) {
        cameraMediaStream.getTracks().forEach(t => t.stop());
        cameraMediaStream = null;
      }
      state.qrCameraStreamActive = false;
    }

    function requestCameraPermission() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        state.user.cameraConsent = 'granted';
        savePersistedState();
        startQrCameraStream();
      } else {
        state.user.cameraConsent = 'denied';
        savePersistedState();
        showToast('카메라 API를 지원하지 않아 QR 코드 직접 입력/시뮬레이션으로 진행해요.');
      }
    }

    function startQrCameraStream() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
          cameraMediaStream = stream;
          state.qrCameraStreamActive = true;
          render();
          const video = document.getElementById('qrVideoFeed');
          if (video) {
            video.srcObject = stream;
            video.play().catch(() => {});
            startBarcodeDetectorLoop(video);
          }
        })
        .catch(() => {
          state.user.cameraConsent = 'denied';
          state.qrCameraStreamActive = false;
          savePersistedState();
          showToast('카메라 연결이 불가하여 아래 QR 코드 인식 시뮬레이션으로 진행해 주세요.');
        });
    }

    function startBarcodeDetectorLoop(videoEl) {
      if (!('BarcodeDetector' in window)) return;
      try {
        const detector = new BarcodeDetector({ formats: ['qr_code'] });
        if (qrScanInterval) clearInterval(qrScanInterval);
        qrScanInterval = setInterval(async () => {
          if (!state.qrCameraStreamActive || state.screen !== 'qr' || state.qrResult) return;
          try {
            const codes = await detector.detect(videoEl);
            if (codes && codes.length > 0) {
              const rawVal = codes[0].rawValue.trim();
              const matched = state.spaces.find(s => s.qrCode === rawVal || s.id === rawVal);
              if (matched) {
                performQrCheckIn(matched.id);
              }
            }
          } catch (e) {
            // Frame not ready
          }
        }, 600);
      } catch (e) {
        // BarcodeDetector unsupported
      }
    }

    function submitManualQrCode() {
      const val = state.qrManualInput.trim().toUpperCase();
      const matched = state.spaces.find(s => s.qrCode === val || s.name === val);
      if (!matched) {
        showToast('일치하는 휴토피아 공간 QR 코드가 없습니다.');
        return;
      }
      state.qrManualInput = '';
      performQrCheckIn(matched.id);
    }

    function performQrCheckIn(spaceId) {
      const sp = getSpaceById(spaceId);
      if (!sp) return;

      if (state.activeCheckIn) {
        state.qrResult = {
          success: false,
          spaceId,
          message: `이미 ${getSpaceById(state.activeCheckIn.spaceId).name}을(를) 이용 중이에요. 먼저 체크아웃해 주세요.`
        };
        render();
        return;
      }

      if (getVacancy(sp) === 0) {
        state.qrResult = {
          success: false,
          spaceId,
          message: `${sp.name}은(는) 현재 만석입니다. 다른 공간을 선택해 주세요.`
        };
        render();
        return;
      }

      stopQrCamera();
      sp.occupiedSeats = Math.min(sp.totalSeats, sp.occupiedSeats + 1);
      state.myLocationId = spaceId;
      state.selectedSpaceId = spaceId;
      state.arrivedAtRestopia = true;
      state.lastUpdatedText = formatTimeNow();

      const ctx = getTimetableContext();
      const totalSec = Math.max(60, state.freeTimeSeconds);
      state.activeCheckIn = {
        spaceId,
        startedAt: formatClockHM(),
        totalRestSeconds: totalSec,
        nextClassName: ctx.nextClass.name,
        nextClassTime: ctx.nextClass.startTime,
        nextBuilding: ctx.nextClass.building,
        walkToClassMin: ctx.nextClass.walkMin
      };
      state.robotForm.locationText = `${sp.name} · ${sp.occupiedSeats}번 좌석`;
      state.qrResult = {
        success: true,
        spaceId,
        message: `${sp.name} 체크인이 완료되었어요!`
      };
      addNotification(
        `${sp.name} 체크인 완료 (${state.activeCheckIn.startedAt})`,
        `다음 수업 ${ctx.nextClass.name}(${ctx.nextClass.startTime}) 전까지 편히 쉬세요.`,
        'home',
        spaceId
      );
      savePersistedState();
      render();
    }

    function checkoutRest() {
      if (!state.activeCheckIn) return;
      const sp = getSpaceById(state.activeCheckIn.spaceId);
      if (sp) sp.occupiedSeats = Math.max(0, sp.occupiedSeats - 1);
      const name = sp ? sp.name : '휴식공간';
      state.activeCheckIn = null;
      state.myLocationId = 'entrance';
      state.arrivedAtRestopia = false;
      state.lastUpdatedText = formatTimeNow();
      savePersistedState();
      showToast(`${name} 체크아웃 완료! 다음 수업 강의실로 이동해 주세요.`);
    }

    // ==================== PERIODIC AUTO-SIMULATION ====================
    function simulateSeatChange(targetSpaceId = null, forceVacate = false) {
      const candidates = targetSpaceId ? [getSpaceById(targetSpaceId)] : state.spaces;
      const sp = candidates[Math.floor(Math.random() * candidates.length)];
      if (!sp) return;
      const prevVac = getVacancy(sp);
      let delta = forceVacate ? -1 : (Math.random() > 0.45 ? -1 : 1);
      if (sp.occupiedSeats + delta < 0) delta = 1;
      if (sp.occupiedSeats + delta > sp.totalSeats) delta = -1;
      // 체크인 중인 내 자리는 비워지지 않도록 보정
      if (state.activeCheckIn && state.activeCheckIn.spaceId === sp.id && sp.occupiedSeats + delta < 1) {
        delta = 1;
      }
      sp.occupiedSeats += delta;
      state.lastUpdatedText = formatTimeNow();

      const newVac = getVacancy(sp);
      if (prevVac === 0 && newVac > 0 && (state.favorites.includes(sp.id) || state.alertSpaceIds.includes(sp.id))) {
        const msg = `찜한 ${sp.name}에 ${newVac}개의 빈자리가 생겼어요.`;
        addNotification(msg, `도보 ${getWalkMinutes(sp.id)}분 · 지금 바로 확인해 보세요.`, 'map', sp.id);
        showToast(msg);
      } else if (state.movingToSpaceId === sp.id && newVac === 0) {
        const alt = getAlternativeSpace(sp.id);
        const msg = alt ? `이동 중인 ${sp.name}이 만석이 되어 ${alt.name}을 추천해 드려요.` : `${sp.name}이 방금 만석이 되었어요.`;
        addNotification(msg, '지도에서 대체 공간을 확인하세요.', 'home', alt ? alt.id : null);
        showToast(msg);
      } else {
        savePersistedState();
        renderPreservingScroll();
      }
    }

    function simulateClassAlert() {
      const ctx = getTimetableContext();
      const alertMin = state.user.classAlertBeforeMin;
      state.freeTimeSeconds = alertMin * 60;
      const title = `다음 수업까지 ${alertMin}분 남았어요. 이제 휴식을 마무리할 시간이에요.`;
      const body = `${ctx.nextClass.building}까지 약 ${ctx.nextClass.walkMin}분이 걸려요. 체크아웃 후 이동해 주세요.`;
      addNotification(title, body, 'home', state.activeCheckIn ? state.activeCheckIn.spaceId : null);
      showToast(title);
    }

    // Timetable CRUD
    function addTimetableClass() {

    // Friends
    function addFriendByCode() {
      const code = state.friendCodeInput.trim().toUpperCase();
      if (code.length < 4) { showToast('친구 코드 10자리를 입력해 주세요.'); return; }
      const names = ['민지', '현우', '서연', '도윤'];
      const spacesPool = ['open', 'quiet', 'snack', 'focus'];
      const nextIdx = state.friends.length;
      const pickedName = names[nextIdx % names.length];
      state.friends.unshift({
        id: 'f_' + Date.now(),
        name: `${pickedName} (${code.slice(0, 4)})`,
        spaceId: spacesPool[nextIdx % spacesPool.length],
        status: 'using',
        isFreeNow: true,
        remainingFreeSeconds: 40 * 60,
        shareAgreed: true,
        color: '#E3F3EA',
        textColor: '#12503D'
      });
      state.friendCodeInput = '';
      showToast(`${pickedName}님을 친구로 추가했어요!`);
    }

    // Report & Robot
    function submitReport() {
      const sp = getSpaceById(state.reportForm.spaceId);
      const detail = state.reportForm.detail.trim() || `${sp.name}에서 ${state.reportForm.issueType} 문제가 발생했습니다.`;
      state.submittedReports.unshift({ id: Date.now(), spaceName: sp.name, issueType: state.reportForm.issueType, detail, time: '방금 전' });
      state.reportForm.detail = '';
      state.reportForm.photoName = '';
      showToast('민원이 접수되었습니다. 관리팀이 빠르게 확인할게요.');
    }
    function toggleSupply(id) {
      const list = state.robotForm.selectedSupplies;
      state.robotForm.selectedSupplies = list.includes(id) ? list.filter(x => x !== id) : [...list, id];
      render();
    }
    function callRobot() {
      if (state.robotForm.selectedSupplies.length === 0) { showToast('필요한 용품을 1개 이상 선택해 주세요.'); return; }
      if (state.robotForm.status === 'dispatching') {
        clearInterval(state.robotTimer); state.robotForm.status = 'idle'; state.robotForm.etaSeconds = 180;
        showToast('로봇 호출을 취소했습니다.'); return;
      }
      state.robotForm.status = 'dispatching'; state.robotForm.etaSeconds = 180;
      render(); showToast('로봇 R-02가 출발했습니다!');
      state.robotTimer = setInterval(() => {
        state.robotForm.etaSeconds -= 30;
        if (state.robotForm.etaSeconds <= 0) {
          clearInterval(state.robotTimer); state.robotForm.status = 'arrived'; state.robotForm.etaSeconds = 0;
          showToast('로봇 R-02가 자리에 도착했습니다!');
        } else { renderPreservingScroll(); }
      }, 1000);
    }

    function handleNotificationClick(notifId) {
      const n = state.notifications.find(x => x.id === notifId);
      if (!n) return;
      n.unread = false;
      state.modal = null;
      if (n.targetTab === 'qr') {
        if (n.targetSpaceId) state.selectedSpaceId = n.targetSpaceId;
        openQrScanner();
      } else if (n.targetSpaceId) {
        openSpaceOnMap(n.targetSpaceId);
      } else {
        switchTab(n.targetTab || 'home');
      }
    }

    // ==================== 9-STEP PRESENTATION DEMO ====================
    function runDemoStep(stepNum) {
      state.demoCurrentStep = stepNum;
      if (state.screen === 'splash' || state.screen === 'login') state.screen = 'main';

      switch (stepNum) {
        case 1: {
          state.activeCheckIn = null;
          state.arrivedAtRestopia = false;
          state.movingToSpaceId = null;
          state.simClockHM = '13:05';
          syncFreeTimeFromTimetable();
          state.screen = 'main';
          state.activeTab = 'home';
          const ctx = getTimetableContext();
          const msg = `수업(${ctx.prevClass ? ctx.prevClass.name : '오전 수업'}) 종료! 다음 수업까지 ${ctx.diffMin}분 남았어요.`;
          addNotification(msg, `${ctx.nextClass.name}(${ctx.nextClass.startTime}) 전까지 휴토피아에서 쉬어가세요.`, 'home', null);
          showToast('Step 1: ' + msg);
          break;
        }
        case 2: {
          const sleep = getSpaceById('sleep');
          sleep.occupiedSeats = sleep.totalSeats;
          if (!state.favorites.includes('sleep')) state.favorites.push('sleep');
          simulateSeatChange('sleep', true);
          state.screen = 'main';
          state.activeTab = 'home';
          break;
        }
        case 3: {
          state.screen = 'main';
          startMoveToSpace('private');
          showToast('Step 3: 이동 모드로 전환되었습니다.');
          break;
        }
        case 4: {
          if (state.moveTimer) { clearInterval(state.moveTimer); state.moveTimer = null; }
          state.movingToSpaceId = 'private';
          simulateSeatChange('open', false);
          state.friends.forEach(f => { f.remainingFreeSeconds = Math.max(60, f.remainingFreeSeconds - 180); });
          state.screen = 'main';
          state.activeTab = 'home';
          showToast('Step 4: 이동 중 좌석 및 친구 공강 시간이 실시간 갱신되었어요.');
          break;
        }
        case 5: {
          state.user.gpsConsent = 'granted';
          updateUserCoordinates(RESTOPIA_COORDS.lat + 0.00005, RESTOPIA_COORDS.lng);
          break;
        }
        case 6: {
          state.screen = 'qr';
          performQrCheckIn('private');
          break;
        }
        case 7: {
          state.screen = 'main';
          state.activeTab = 'home';
          showToast('Step 7: 휴식 모드(원형 타이머·로봇 호출)가 활성화되었어요.');
          break;
        }
        case 8: {
          state.screen = 'main';
          state.activeTab = 'home';
          simulateClassAlert();
          break;
        }
        case 9: {
          state.screen = 'main';
          state.activeTab = 'home';
          checkoutRest();
          break;
        }
      }
      render();
    }

    // ==================== 5-MODE CONTEXT-AWARE HOME TAB ====================
    function renderContextHeroCard() {
      const mode = getContextMode();
      const freeMin = getFreeMinutes();
      const ctx = getTimetableContext();

      // 5) 수업 준비 모드 (10분 전 지각 방지)
      if (mode === 'class_prep') {
        const sp = getSpaceById(state.activeCheckIn.spaceId);
        return `
          <div class="bg-[#FDF4E3] border-2 border-[#E8B968] rounded-3xl p-5 text-center space-y-3 shadow-sm">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#FBE5BC] text-[#9A5B0D] text-[11.5px] font-extrabold">
              ⏰ 수업 준비 모드 · 지각 방지 알림
            </div>
            <div>
              <div data-countdown="min" class="text-[40px] font-extrabold text-[#B86E14] leading-none">${freeMin}분</div>
              <div class="text-[13px] font-bold text-[#6E4409] mt-1">다음 수업까지 (<span data-countdown="sec">${formatCountdown(state.freeTimeSeconds)}</span>)</div>
            </div>
            <div class="bg-white/80 rounded-2xl p-3 text-[12.5px] text-[#4A320C]">
              <b>${state.activeCheckIn.nextClassName}</b> (${state.activeCheckIn.nextClassTime})<br/>
              ${state.activeCheckIn.nextBuilding}까지 도보 약 <b>${state.activeCheckIn.walkToClassMin}분</b> 소요
            </div>
            <button onclick="checkoutRest()"
              class="w-full py-3.5 rounded-2xl bg-[#12503D] hover:bg-[#0D3D2E] text-white font-extrabold text-[15px] shadow-sm transition">
              ${sp ? sp.name : ''} 체크아웃하고 이동하기
            </button>
          </div>
        `;
      }

      // 4) 휴식 모드 (원형 타이머 + 로봇 호출/알림/종료만 집중)
      if (mode === 'resting') {
        const sp = getSpaceById(state.activeCheckIn.spaceId);
        const recRestMin = Math.max(0, freeMin - state.activeCheckIn.walkToClassMin);
        const total = Math.max(60, state.activeCheckIn.totalRestSeconds || 3300);
        const pct = Math.min(1, Math.max(0, state.freeTimeSeconds / total));
        const circ = 2 * Math.PI * 52;
        const offset = circ * (1 - pct);

        return `
          <div class="bg-[#12503D] text-white rounded-3xl p-5 shadow-md space-y-4 text-center">
            <div class="flex items-center justify-between text-[11.5px]">
              <span class="px-2.5 py-1 rounded-full bg-white/15 font-bold">휴식 모드 · ${sp ? sp.name : ''}</span>
              <span class="text-white/80">${state.activeCheckIn.startedAt} 체크인</span>
            </div>

            <div class="relative w-36 h-36 mx-auto flex items-center justify-center">
              <svg class="w-full h-full -rotate-90" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="8" />
                <circle data-countdown="ring" cx="60" cy="60" r="52" fill="none" stroke="#6EE7B7" stroke-width="8" stroke-linecap="round"
                  stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" />
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center">
                <div class="text-[28px] font-extrabold leading-none">${recRestMin}분</div>
                <div class="text-[11px] text-[#A7F3D0] font-semibold mt-1">휴식 가능</div>
                <div data-countdown="sec" class="text-[10px] text-white/70 mt-0.5">${formatCountdown(state.freeTimeSeconds)}</div>
              </div>
            </div>

            <div class="text-[12px] text-white/85">
              다음 수업: <b>${state.activeCheckIn.nextClassName}</b> (${state.activeCheckIn.nextClassTime} · 도보 ${state.activeCheckIn.walkToClassMin}분)
            </div>

            <div class="flex gap-2">
              <button onclick="checkoutRest()"
                class="flex-1 py-3 rounded-2xl bg-white text-[#12503D] font-extrabold text-[14px] hover:bg-[#EBF3EE] transition">
                휴식 종료
              </button>
              <button onclick="state.screen = 'robot'; render();"
                class="px-4 py-3 rounded-2xl bg-white/15 text-white font-bold text-[13px] hover:bg-white/25 transition">
                로봇 호출
              </button>
            </div>
          </div>
        `;
      }

      // 3) 도착 모드 (불필요한 정보 숨기고 QR 스캔 최우선)
      if (mode === 'arrived') {
        const target = getSpaceById(state.selectedSpaceId);
        return `
          <div class="bg-[#0E241C] text-white rounded-3xl p-6 shadow-md text-center space-y-4">
            <div class="text-[12px] font-bold text-[#6EE7B7]">📍 도착 모드 · 휴토피아 (${state.distanceMeters}m)</div>
            <h2 class="text-[24px] font-extrabold leading-tight">도착했어요!</h2>
            <p class="text-[12.5px] text-white/80">${target ? target.name : '휴식공간'} 앞 QR코드를 스캔하면 즉시 휴식이 시작됩니다.</p>
            <button onclick="openQrScanner()"
              class="mx-auto w-36 h-36 rounded-3xl border-2 border-[#34D399] bg-[#12503D]/60 hover:bg-[#12503D] flex flex-col items-center justify-center gap-2 transition shadow-lg">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                <path d="M14 14h3v3h-3z"/><path d="M18 18h3v3h-3z"/>
              </svg>
              <span class="text-[14px] font-extrabold text-white">QR 스캔하기</span>
            </button>
            <button onclick="state.arrivedAtRestopia = false; render();" class="text-[11.5px] text-white/60 underline">다른 공간 둘러보기</button>
          </div>
        `;
      }

      // 2) 이동 모드 (실시간 혼잡도 + 선택한 공간 빈자리 + 만석 시 대체 공간 추천)
      if (mode === 'moving') {
        const target = getSpaceById(state.movingToSpaceId);
        const vac = getVacancy(target);
        const cong = getCongestion(target);
        const friendsCount = state.friends.filter(f => f.shareAgreed && f.isFreeNow).length;
        const alt = vac === 0 ? getAlternativeSpace(target.id) : null;
        const fromPt = getLocationCoords(state.myLocationId);
        const toPt = target.center;

        return `
          <div class="bg-white border-2 border-[#12503D] rounded-3xl p-4 shadow-md space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded-full bg-[#E7F5EE] text-[#12503D] text-[11.5px] font-extrabold">🚶 이동 모드 · ${target.name}</span>
              <span class="text-[12px] font-bold text-[#12503D]">거리 ${state.distanceMeters}m (${state.moveProgress}%)</span>
            </div>

            <!-- 미니 실시간 경로 지도 -->
            <div class="relative h-24 rounded-2xl bg-[#EBF2EE] border border-[#D4E3DA] overflow-hidden flex items-center justify-between px-5">
              <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                <line x1="${fromPt.x}" y1="${fromPt.y}" x2="${toPt.x}" y2="${toPt.y}" stroke="#12503D" stroke-width="2" class="route-dash" />
              </svg>
              <div class="z-10 flex items-center gap-1.5 bg-white px-2.5 py-1 rounded-full shadow-xs text-[11px] font-bold text-[#2563EB]">
                <span class="w-2.5 h-2.5 rounded-full bg-[#2563EB]"></span>내 위치
              </div>
              <div class="z-10 flex items-center gap-1.5 bg-[#12503D] text-white px-3 py-1.5 rounded-xl shadow-xs text-[11.5px] font-extrabold">
                ${target.name} · ${cong.text}
              </div>
            </div>

            <div class="flex items-center justify-between text-[12.5px]">
              <span class="font-bold text-[#12503D]">도착까지 약 ${getWalkMinutes(target.id)}분</span>
              <span class="text-[#5E7369]">친구 ${friendsCount}명 이용 중 · <span class="font-bold">${cong.label}</span></span>
            </div>

            ${alt ? `
              <div class="bg-[#FDEEEE] border border-[#EE9B9B] rounded-2xl p-3 flex items-center justify-between gap-2">
                <div class="text-[11.5px] text-[#9E2A2A]"><b>${target.name} 만석!</b> 대체 공간 <b>${alt.name}</b>(${getVacancy(alt)}석) 추천</div>
                <button onclick="startMoveToSpace('${alt.id}')" class="px-2.5 py-1.5 rounded-xl bg-[#12503D] text-white text-[11px] font-bold shrink-0">변경</button>
              </div>
            ` : ''}

            <div class="flex gap-2">
              <button onclick="openSpaceOnMap('${target.id}')" class="flex-1 py-2.5 rounded-xl bg-[#EBF3EE] text-[#12503D] font-bold text-[13px]">상세 지도</button>
              <button onclick="handleGpsArrivalDetected()" class="flex-1 py-2.5 rounded-xl bg-[#12503D] text-white font-bold text-[13px]">도착 완료 처리</button>
              <button onclick="startMoveToSpace('${target.id}')" class="px-3 py-2.5 rounded-xl bg-[#F4F6F4] text-[#5E7369] font-bold text-[12px]">취소</button>
            </div>
          </div>
        `;
      }

      // 1) 공강 시작 모드 (남은 공강 + 찜한 공간 + 공간 찾기)
      const firstFav = state.spaces.find(s => state.favorites.includes(s.id)) || state.spaces[1];
      const firstFavCong = getCongestion(firstFav);
      return `
        <div class="space-y-3">
          <div class="bg-[#12503D] text-white rounded-3xl p-5 shadow-md space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded-full bg-white/15 text-[11px] font-bold">
                공강 시작 모드 · ${ctx.prevClass ? ctx.prevClass.name + ' 종료' : '시간표 자동 계산'}
              </span>
              <button onclick="state.modal = 'freeTime'; render();" class="text-[11px] underline text-white/80">시간 수정</button>
            </div>
            <div class="flex items-end justify-between gap-2">
              <div>
                <div class="text-[12px] text-white/80">남은 공강</div>
                <div data-countdown="min" class="text-[36px] font-extrabold leading-none mt-1">${freeMin}분</div>
              </div>
              <div class="text-right">
                <div class="text-[12px] font-bold text-[#A7F3D0]">다음: ${ctx.nextClass.name}${ctx.nextClass.professor ? ` (${ctx.nextClass.professor})` : ''}</div>
                <div class="text-[11px] text-white/80">${ctx.nextClass.startTime} · ${ctx.nextClass.building}</div>
              </div>
            </div>
            <button onclick="switchTab('map')"
              class="w-full py-3 rounded-2xl bg-white text-[#12503D] font-extrabold text-[14.5px] hover:bg-[#EBF3EE] transition">
              공간 찾기
            </button>
          </div>

          <!-- 찜한 공간 우선 노출 카드 -->
          <div onclick="openSpaceOnMap('${firstFav.id}')" class="bg-white rounded-2xl p-3.5 border border-[#E2EAE5] flex items-center justify-between cursor-pointer">
            <div>
              <div class="text-[11px] font-bold text-[#5E7369]">♥ 찜한 공간 우선 확인</div>
              <div class="text-[15.5px] font-extrabold text-[#12503D] mt-0.5">${firstFav.name} · ${firstFavCong.text}</div>
            </div>
            <span class="px-2.5 py-1 rounded-full text-[11px] font-bold ${getStatusBadgeClasses(firstFavCong.key)}">${firstFavCong.label}</span>
          </div>
        </div>
      `;
    }

    function renderHomeTab() {
      const stats = getTotalSeatsStats();
      const favSpaces = state.spaces.filter(s => state.favorites.includes(s.id));
      const recommended = state.spaces.filter(s => getVacancy(s) > 0).sort((a, b) => getWalkMinutes(a.id) - getWalkMinutes(b.id)).slice(0, 3);
      const freeFriends = state.friends.filter(f => f.isFreeNow && f.shareAgreed);

      return `
        <div class="px-4 pt-4 pb-6 space-y-4">
          ${renderContextHeroCard()}

          <!-- 찜한 공간 전체 -->
          <section>
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-[14px] font-extrabold text-[#1A2420]">찜한 휴식공간 (${favSpaces.length})</h3>
              <button onclick="state.listFilter = 'favorites'; state.mapViewMode = 'list'; switchTab('map');" class="text-[11.5px] font-bold text-[#12503D]">전체 보기 ›</button>
            </div>
            <div class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1">
              ${favSpaces.map(sp => {
                const c = getCongestion(sp);
                return `
                  <div onclick="openSpaceOnMap('${sp.id}')" class="min-w-[156px] bg-white rounded-2xl p-3 border border-[#E2EAE5] cursor-pointer shrink-0">
                    <div class="flex items-center justify-between">
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${getStatusBadgeClasses(c.key)}">${c.label}</span>
                      <button onclick="event.stopPropagation(); toggleFavorite('${sp.id}');" class="text-[#E11D48] text-[15px]">♥</button>
                    </div>
                    <div class="text-[13.5px] font-extrabold text-[#1A2420] mt-1.5">${sp.name}</div>
                    <div class="text-[11px] text-[#5E7369] mt-0.5">${c.text} · 도보 ${getWalkMinutes(sp.id)}분</div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>

          <!-- 휴토피아 전체 좌석 & GPS 도착 감지 -->
          <section class="bg-white rounded-2xl p-3.5 border border-[#E2EAE5] flex items-center justify-between">
            <div>
              <div class="text-[11px] font-semibold text-[#5E7369]">실시간 전체 좌석 (${state.lastUpdatedText})</div>
              <div class="text-[15.5px] font-extrabold text-[#12503D] mt-0.5">전체 ${stats.total}석 중 <span class="text-[#16794C]">${stats.vacant}석</span> 이용 가능</div>
            </div>
            <button onclick="requestGpsCheck()" class="px-3 py-2 rounded-xl bg-[#EBF3EE] text-[#12503D] text-[11.5px] font-bold shrink-0">

            </button>
          </section>

          <!-- 추천 휴식공간 -->
          <section>
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-[14px] font-extrabold text-[#1A2420]">지금 이용 가능한 추천 공간</h3>
              <button onclick="state.mapViewMode = 'list'; state.listFilter = 'available'; switchTab('map');" class="text-[11.5px] font-bold text-[#12503D]">목록 ›</button>
            </div>
            <div class="space-y-2">
              ${recommended.map(sp => {
                const c = getCongestion(sp);
                const isFav = state.favorites.includes(sp.id);
                return `
                  <div onclick="openSpaceOnMap('${sp.id}')" class="bg-white rounded-2xl p-3 border border-[#E2EAE5] flex items-center justify-between cursor-pointer">
                    <div class="min-w-0">
                      <div class="flex items-center gap-2">
                        <span class="text-[13.5px] font-extrabold text-[#1A2420]">${sp.name}</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${getStatusBadgeClasses(c.key)}">${c.label}</span>
                      </div>
                      <div class="text-[11px] text-[#6B7E75] mt-0.5">도보 ${getWalkMinutes(sp.id)}분 · ${c.text}</div>
                    </div>
                    <button onclick="event.stopPropagation(); toggleFavorite('${sp.id}');" class="w-8 h-8 rounded-xl bg-[#F4F6F3] flex items-center justify-center text-[15px] ${isFav ? 'text-[#E11D48]' : 'text-[#9CA3AF]'}">${isFav ? '♥' : '♡'}</button>
                  </div>
                `;
              }).join('')}
            </div>
          </section>

          <!-- 같은 공강 친구 -->
          <section class="bg-white rounded-2xl p-3.5 border border-[#E2EAE5]">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-[14px] font-extrabold text-[#1A2420]">같은 공강 친구 (${freeFriends.length}명)</h3>
              <button onclick="switchTab('friends')" class="text-[11.5px] font-bold text-[#12503D]">자세히 ›</button>
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
              ${freeFriends.map(f => {
                const sp = getSpaceById(f.spaceId);
                return `
                  <button onclick="openSpaceOnMap('${f.spaceId}')" class="flex items-center gap-2 px-3 py-2 rounded-xl bg-[#F4F6F4] shrink-0 text-left">
                    <span class="w-7 h-7 rounded-full flex items-center justify-center text-[12px] font-extrabold" style="background:${f.color}; color:${f.textColor};">${f.name.charAt(0)}</span>
                    <div>
                      <div class="text-[12px] font-bold text-[#1A2420]">${f.name} · ${Math.ceil(f.remainingFreeSeconds / 60)}분</div>
                      <div class="text-[10.5px] text-[#5E7369]">${sp ? sp.name : ''} ${f.status === 'moving' ? '이동 중' : '이용 중'}</div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </section>

          <!-- 최근 알림 -->
          <section class="bg-white rounded-2xl p-3.5 border border-[#E2EAE5]">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-[14px] font-extrabold text-[#1A2420]">최근 알림</h3>
              <button onclick="state.modal = 'notifications'; render();" class="text-[11.5px] font-bold text-[#12503D]">전체</button>
            </div>
            <div class="space-y-2">
              ${state.notifications.slice(0, 2).map(n => `
                <button onclick="handleNotificationClick('${n.id}')" class="w-full text-left p-2.5 rounded-xl ${n.unread ? 'bg-[#EBF5EF]' : 'bg-[#F6F8F6]'}">
                  <div class="text-[12px] font-bold text-[#12503D] truncate">${n.title}</div>
                  <p class="text-[10.5px] text-[#5E7369] mt-0.5 truncate">${n.body}</p>
                </button>
              `).join('')}

          </section>
        </div>
      `;

    // ==================== MAP & LIST TAB ====================
    function renderMapTab() {
      const freeMin = getFreeMinutes();
      return `
        <div class="px-4 pt-3.5 pb-6 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h2 class="text-[20px] font-extrabold text-[#12503D] leading-tight">휴토피아 공간</h2>
              <p class="text-[11px] text-[#5E7369]">자동 갱신 ${state.lastUpdatedText} · 공강 <span data-countdown="min">${freeMin}분</span></p>
            </div>
            <div class="flex items-center gap-1 bg-white p-1 rounded-xl border border-[#DCE5DF]">
              <button onclick="state.mapViewMode = 'map'; render();" class="px-3 py-1 rounded-lg text-[12px] font-bold ${state.mapViewMode === 'map' ? 'bg-[#12503D] text-white' : 'text-[#5E7369]'}">지도</button>
              <button onclick="state.mapViewMode = 'list'; render();" class="px-3 py-1 rounded-lg text-[12px] font-bold ${state.mapViewMode === 'list' ? 'bg-[#12503D] text-white' : 'text-[#5E7369]'}">목록</button>
            </div>
          </div>
          ${state.mapViewMode === 'map' ? renderInteractiveMapBody() : renderListBody()}
        </div>
      `;
    }

    function renderInteractiveMapBody() {
      const selected = getSpaceById(state.selectedSpaceId) || state.spaces[0];
      const cong = getCongestion(selected);
      const vac = getVacancy(selected);
      const walkMin = getWalkMinutes(selected.id);
      const estRest = Math.max(0, getFreeMinutes() - walkMin);
      const isMovingHere = state.movingToSpaceId === selected.id;
      const isCheckedInHere = state.activeCheckIn && state.activeCheckIn.spaceId === selected.id;
      const friendsHere = getFriendsInSpace(selected.id);
      const isFav = state.favorites.includes(selected.id);

      const fromPt = getLocationCoords(state.myLocationId);
      const toPt = state.movingToSpaceId ? getLocationCoords(state.movingToSpaceId) : null;

      const renderRoomTile = (id, extraClass = '') => {
        const sp = getSpaceById(id);
        const c = getCongestion(sp);
        const isSel = state.selectedSpaceId === id;
        const fr = getFriendsInSpace(id);
        const isMyLoc = state.myLocationId === id;
        return `
          <div onclick="state.selectedSpaceId='${id}'; state.detailExpanded=false; render();"
            class="room-tile relative rounded-2xl border-2 p-1.5 flex flex-col items-center justify-center text-center ${getTileClasses(c.key)} ${isSel ? 'selected' : ''} ${extraClass}">
            <div class="text-[11px] font-extrabold leading-tight">${sp.name}</div>
            <div class="text-[10px] font-semibold opacity-90 mt-0.5">${c.text} (${sp.occupiedSeats}/${sp.totalSeats})</div>
            ${fr.length > 0 ? `<div class="flex flex-wrap justify-center gap-1 mt-1">${fr.slice(0, 2).map(f => `<span class="px-1.5 py-0.5 rounded-full bg-white border border-current text-[9px] font-bold leading-none">${f.name}</span>`).join('')}</div>` : ''}
            ${isMyLoc ? `<div class="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full bg-[#2563EB] border-2 border-white shadow"></div>` : ''}
          </div>
        `;
      };

      return `
        <div class="bg-white rounded-3xl p-3 border border-[#E2EAE5] shadow-xs">
          <div class="relative bg-[#F5F7F5] rounded-2xl p-2 border border-[#E7ECE9]">
            ${toPt ? `<svg class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="${fromPt.x}" y1="${fromPt.y}" x2="${toPt.x}" y2="${toPt.y}" stroke="#12503D" stroke-width="1.6" stroke-linecap="round" class="route-dash" /></svg>` : ''}
            <div class="grid grid-cols-12 gap-2 auto-rows-[58px]">
              <div class="col-span-3 flex items-center justify-center">
                <button onclick="state.autoSimEnabled = !state.autoSimEnabled; showToast(state.autoSimEnabled ? '실시간 자동 변동 ON' : '실시간 자동 변동 OFF');"
                  class="px-2 py-1.5 rounded-xl border text-[10px] font-bold ${state.autoSimEnabled ? 'bg-[#E7F5EE] border-[#86C9A6] text-[#12503D]' : 'bg-white border-[#DCE5DF] text-[#6B7E75]'}">
                  자동변동<br/>${state.autoSimEnabled ? 'ON' : 'OFF'}
                </button>
              </div>
              ${renderRoomTile('quiet', 'col-span-5')}
              ${renderRoomTile('private', 'col-span-4')}
              ${renderRoomTile('sleep', 'col-span-3')}
              ${renderRoomTile('open', 'col-span-5')}
              ${renderRoomTile('focus', 'col-span-4')}
              <div onclick="state.modal = 'myLocation'; render();"
                class="col-span-3 rounded-2xl border-2 border-dashed border-[#C2CCC6] bg-[#EDF1EE] flex flex-col items-center justify-center text-center p-1 cursor-pointer relative">
                <span class="text-[10px] font-semibold text-[#5E7369] leading-tight">라운지<br/>입구</span>
                ${state.myLocationId === 'entrance' ? `<div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="w-6 h-6 rounded-full bg-[#3B82F6]/30 location-ping"></span><span class="absolute w-3.5 h-3.5 rounded-full bg-[#2563EB] border-2 border-white shadow"></span></div>` : ''}
              </div>
              ${renderRoomTile('massage', 'col-span-3')}
              ${renderRoomTile('snack', 'col-span-6')}
            </div>
          </div>

          <div class="flex items-center justify-between mt-2.5 px-1 text-[11px]">
            <div class="flex items-center gap-2 font-semibold text-[#475850]">
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#16794C]"></span>여유</span>
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#D68924]"></span>보통</span>
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#D9534F]"></span>혼잡</span>
            </div>
            <button onclick="requestGpsCheck()" class="font-bold text-[#12503D] bg-[#EBF3EE] px-2.5 py-1 rounded-lg">
              📍 거리 ${state.distanceMeters}m
            </button>
          </div>
        </div>

        <div class="bg-white rounded-3xl p-4 border border-[#E2EAE5] shadow-xs">
          <div class="flex items-center justify-between gap-2">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-[17px] font-extrabold text-[#1A2420]">${selected.name}</h3>
                <span class="px-2 py-0.5 rounded-full text-[10.5px] font-bold ${getStatusBadgeClasses(cong.key)}">${cong.label}</span>
              </div>
              <p class="text-[11px] text-[#6B7E75] mt-0.5">${selected.category} · ${selected.tags.join(' · ')}</p>
            </div>
            <button onclick="toggleFavorite('${selected.id}')" class="w-10 h-10 rounded-xl bg-[#F4F6F3] flex items-center justify-center text-[18px] ${isFav ? 'text-[#E11D48]' : 'text-[#9CA3AF]'}">${isFav ? '♥' : '♡'}</button>
          </div>

          ${friendsHere.length > 0 ? `<div class="mt-2.5 text-[11.5px] text-[#4C5E55] bg-[#F5F8F6] px-3 py-1.5 rounded-xl"><b class="text-[#12503D]">공강 친구:</b> ${friendsHere.map(f => `${f.name}(${f.status === 'moving' ? '이동 중' : '이용 중'})`).join(', ')}</div>` : ''}

          <div class="grid grid-cols-3 gap-2 mt-3">
            <div class="bg-[#F4F6F4] rounded-2xl p-2.5"><div class="text-[10.5px] text-[#6B7E75]">빈자리</div><div class="text-[14.5px] font-extrabold text-[#12503D]">${vac === 0 ? '만석' : vac + '석'} <span class="text-[11px] font-normal text-[#6B7E75]">/${selected.totalSeats}</span></div></div>
            <div class="bg-[#F4F6F4] rounded-2xl p-2.5"><div class="text-[10.5px] text-[#6B7E75]">예상 이동</div><div class="text-[14.5px] font-extrabold text-[#12503D]">${walkMin}분</div></div>
            <div class="bg-[#F4F6F4] rounded-2xl p-2.5"><div class="text-[10.5px] text-[#6B7E75]">예상 휴식</div><div class="text-[14.5px] font-extrabold text-[#12503D]">${estRest}분</div></div>
          </div>

          <button onclick="state.detailExpanded = !state.detailExpanded; render();" class="w-full mt-2 py-1 text-[11.5px] font-semibold text-[#5E7369]">공간 상세 정보 ${state.detailExpanded ? '접기 −' : '더보기 +'}</button>
          ${state.detailExpanded ? `<div class="mt-1 mb-2 p-3 rounded-2xl bg-[#F6F8F6] text-[12px] text-[#45564E]"><p>${selected.description}</p><p class="mt-1 font-bold text-[#12503D]">QR 식별코드: ${selected.qrCode}</p></div>` : ''}

          <div class="flex gap-2 mt-2">
            <button onclick="startMoveToSpace('${selected.id}')"
              class="flex-1 py-3 rounded-2xl font-bold text-[13.5px] ${isCheckedInHere ? 'bg-[#E7EFEA] text-[#12503D]' : isMovingHere ? 'bg-[#D97706] text-white' : vac === 0 ? 'bg-[#E5EAE7] text-[#7D8C84]' : 'bg-[#12503D] text-white'}">
              ${isCheckedInHere ? '체크아웃' : isMovingHere ? `이동 중 (${state.moveProgress}%) · 취소` : vac === 0 ? '만석' : '이곳으로 이동'}
            </button>
            <button onclick="openQrScanner()" class="px-4 py-3 rounded-2xl bg-[#EBF3EE] text-[#12503D] font-extrabold text-[13px]">QR 체크인</button>
          </div>
        </div>
      `;
    }

    function renderListBody() {
      const filters = [
        { id: 'all', label: '전체' }, { id: 'favorites', label: '♥ 찜한 공간' },
        { id: 'available', label: '빈자리 있음' }, { id: 'lie', label: '누워 쉬기' }, { id: 'quiet', label: '조용한 곳' }
      ];
      const items = getFilteredSpaces();
      return `
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
          ${filters.map(f => `<button onclick="setListFilter('${f.id}')" class="px-3.5 py-2 rounded-full text-[12px] font-bold whitespace-nowrap ${state.listFilter === f.id ? 'bg-[#12503D] text-white' : 'bg-white text-[#4A5C53] border border-[#DCE5DF]'}">${f.label}</button>`).join('')}
        </div>
        <div class="space-y-2.5">
          ${items.map(sp => {
            const cong = getCongestion(sp); const vac = getVacancy(sp); const walk = getWalkMinutes(sp.id);
            const isAlertOn = state.alertSpaceIds.includes(sp.id); const isFav = state.favorites.includes(sp.id);
            const iconBg = cong.key === 'avail' ? 'bg-[#E5F4EC] text-[#16794C]' : cong.key === 'mod' ? 'bg-[#FCF3E1] text-[#B86E14]' : 'bg-[#FCEAEA] text-[#C93B3B]';
            return `
              <div onclick="openSpaceOnMap('${sp.id}')" class="bg-white rounded-2xl p-3.5 border border-[#E2EAE5] flex items-center justify-between gap-2 cursor-pointer">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-11 h-11 rounded-xl ${iconBg} flex items-center justify-center text-[12px] font-extrabold shrink-0">${sp.shortName}</div>
                  <div class="min-w-0">
                    <div class="text-[14.5px] font-extrabold text-[#1A2420] truncate">${sp.name}</div>
                    <div class="text-[11.5px] text-[#6B7E75] mt-0.5">도보 ${walk}분 · ${cong.text} (${sp.occupiedSeats}/${sp.totalSeats}명)</div>
                  </div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0" onclick="event.stopPropagation()">
                  <button onclick="toggleFavorite('${sp.id}')" class="w-8 h-8 rounded-lg bg-[#F4F6F3] flex items-center justify-center text-[15px] ${isFav ? 'text-[#E11D48]' : 'text-[#9CA3AF]'}">${isFav ? '♥' : '♡'}</button>
                  ${vac === 0 ? `<button onclick="toggleAlert('${sp.id}')" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold border ${isAlertOn ? 'bg-[#12503D] text-white border-[#12503D]' : 'bg-white text-[#12503D] border-[#12503D]'}">${isAlertOn ? '알림중' : '알림받기'}</button>` : ''}
                  <span class="px-2.5 py-1 rounded-full text-[11px] font-bold ${getStatusBadgeClasses(cong.key)}">${cong.label}</span>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // ==================== FRIENDS TAB ====================
    function renderFriendsTab() {
      return `
        <div class="px-4 pt-4 pb-6 space-y-4">
          <div class="flex items-start justify-between gap-2">
            <div>
              <p class="text-[11.5px] font-semibold text-[#5E7369]">시간 경과에 따른 실시간 상태</p>
              <h2 class="text-[22px] font-extrabold text-[#12503D] tracking-tight mt-0.5">친구 위치 · 공강 현황</h2>
            </div>
            <div class="bg-[#EBF3EE] border border-[#D4E3DA] rounded-2xl px-3.5 py-2 text-right shrink-0">
              <div class="text-[10.5px] font-semibold text-[#5E7369]">내 남은 공강</div>
              <div data-countdown="min" class="text-[17px] font-extrabold text-[#12503D] leading-tight">${getFreeMinutes()}분</div>
            </div>
          </div>

          <div class="bg-white rounded-3xl p-4 border border-[#E2EAE5]">
            <div class="text-[15px] font-extrabold text-[#1A2420]">공강 중인 친구 (${state.friends.filter(f => f.shareAgreed).length}명)</div>
            <div class="divide-y divide-[#EEF2EF] mt-2">
              ${state.friends.map(f => {
                const sp = getSpaceById(f.spaceId);
                const fMin = Math.ceil(f.remainingFreeSeconds / 60);
                return `
                  <div class="py-3 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-10 h-10 rounded-full flex items-center justify-center font-extrabold text-[14px] shrink-0" style="background:${f.color}; color:${f.textColor};">${f.name.charAt(0)}</div>
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5">
                          <span class="text-[14.5px] font-bold text-[#1A2420]">${f.name}</span>
                          ${f.shareAgreed ? `<span class="px-1.5 py-0.5 rounded bg-[#EBF3EE] text-[#12503D] text-[10px] font-bold">공강 ${fMin}분</span>` : ''}
                        </div>
                        <div class="text-[12px] text-[#6B7E75] truncate">
                          ${!f.shareAgreed ? '위치 공유 비공개' : f.status === 'moving' ? `휴토피아(${sp ? sp.name : ''})로 이동 중` : `${sp ? sp.name : '라운지'} 이용 중`}
                        </div>
                      </div>
                    </div>
                    ${f.shareAgreed ? `<button onclick="openSpaceOnMap('${f.spaceId}')" class="px-3 py-1.5 rounded-xl bg-[#F4F7F5] text-[12px] font-bold text-[#12503D] shrink-0">위치 확인</button>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="bg-white rounded-3xl p-4 border border-[#E2EAE5] space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-[13.5px] font-bold text-[#1A2420]">내 위치 친구에게 공개</div>
                <div class="text-[11.5px] text-[#6B7E75]">체크인 시 친구 지도에 표시</div>
              </div>
              <button onclick="state.user.shareLocation = !state.user.shareLocation; savePersistedState(); showToast(state.user.shareLocation ? '위치 공개 ON' : '위치 공개 OFF');"
                class="w-12 h-7 rounded-full transition relative ${state.user.shareLocation ? 'bg-[#12503D]' : 'bg-[#CBD5CE]'}">
                <span class="absolute top-1 w-5 h-5 rounded-full bg-white shadow transition-all ${state.user.shareLocation ? 'left-6' : 'left-1'}"></span>
              </button>
            </div>
            <div class="flex gap-2">
              <input type="text" maxlength="10" value="${state.friendCodeInput}" oninput="state.friendCodeInput = this.value" placeholder="친구 코드 10자리"
                class="flex-1 min-w-0 px-3.5 py-2.5 rounded-xl bg-[#F8FAF8] border border-[#DCE5DF] text-[13.5px]" />
              <button onclick="addFriendByCode()" class="px-4 py-2.5 rounded-xl bg-[#12503D] text-white font-bold text-[13px] shrink-0">추가</button>
            </div>
            <div class="pt-2 border-t border-[#EEF2EF] flex items-center justify-between">
              <div><div class="text-[11px] text-[#5E7369]">내 친구 코드</div><div class="text-[16px] font-extrabold tracking-widest text-[#12503D] font-mono">${state.user.friendCode}</div></div>
              <button onclick="copyText('${state.user.friendCode}')" class="px-3.5 py-1.5 rounded-xl bg-[#F4F6F4] border border-[#DCE5DF] text-[12.5px] font-bold">복사</button>
            </div>
          </div>
        </div>
      `;
    }

    // ==================== PROFILE TAB ====================
    function renderProfileTab() {
      const ctx = getTimetableContext();
      return `
        <div class="px-4 pt-4 pb-6 space-y-4">
          <div class="bg-[#12503D] text-white rounded-3xl p-4 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-3.5">
              <div class="w-12 h-12 rounded-full bg-[#DCE9E2] text-[#12503D] flex items-center justify-center font-extrabold text-[18px]">${state.user.name.charAt(0)}</div>

              <span class="text-[13.5px] font-bold text-[#1A2420]">스마트폰 알림 연동 (Push)</span>
