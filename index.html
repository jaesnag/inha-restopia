    // ==================== QR SCANNER SCREEN (WITH VIDEO + BARCODE DETECTOR) ====================
    function renderQrScreen() {
      return `
        <div class="w-full h-full bg-[#101815] text-white flex flex-col">
          <header class="px-4 py-3.5 flex items-center justify-between border-b border-white/10 shrink-0">
            <button onclick="stopQrCamera(); state.screen = 'main'; render();" class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <h2 class="text-[16px] font-extrabold">QR 코드 체크인</h2>
            <div class="w-9"></div>
          </header>

          <div class="scroll-area px-5 py-5 space-y-4">
            ${state.qrResult ? `
              <div class="rounded-3xl p-5 text-center space-y-3 ${state.qrResult.success ? 'bg-[#12503D]' : 'bg-[#7F1D1D]'}">
                <div class="w-14 h-14 mx-auto rounded-full bg-white/20 flex items-center justify-center text-[26px] font-bold">${state.qrResult.success ? '✓' : '!'}</div>
                <h3 class="text-[19px] font-extrabold">${state.qrResult.success ? '체크인 완료!' : '체크인 불가'}</h3>
                <p class="text-[13px] text-white/90">${state.qrResult.message}</p>
                <div class="pt-2 flex gap-2">
                  <button onclick="switchTab('home')" class="flex-1 py-3 rounded-xl bg-white text-[#12503D] font-extrabold text-[13.5px]">휴식 모드 보기</button>
                  <button onclick="state.qrResult = null; render();" class="px-4 py-3 rounded-xl bg-white/15 text-white font-bold text-[13px]">다시 스캔</button>
                </div>
              </div>
            ` : `
              <div class="relative mx-auto w-60 h-60 rounded-3xl border-2 border-white/30 bg-black/60 flex flex-col items-center justify-center overflow-hidden">
                <video id="qrVideoFeed" playsinline muted class="absolute inset-0 w-full h-full object-cover ${state.qrCameraStreamActive ? '' : 'hidden'}"></video>
                <div class="w-40 h-40 border-2 border-[#34D399] rounded-2xl relative z-10">
                  <div class="qr-scan-line absolute left-2 right-2 h-0.5 bg-[#34D399] shadow-[0_0_8px_#34D399]"></div>
                </div>
                <p class="text-[11px] text-white/80 mt-2 z-10 bg-black/50 px-2 py-0.5 rounded">
                  ${state.qrCameraStreamActive ? '카메라 QR 자동 인식 중...' : '공간 QR 코드를 스캔하세요'}
                </p>
              </div>

              <div class="flex justify-center">
                <button onclick="requestCameraPermission()" class="px-4 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-[12px] font-bold">
                  ${state.qrCameraStreamActive ? '📷 카메라 스트림 작동 중' : '📷 카메라 켜기 (실제 QR 인식)'}
                </button>
              </div>

              <div class="flex gap-2">
                <input type="text" value="${state.qrManualInput}" oninput="state.qrManualInput = this.value" placeholder="QR 코드 직접 입력 (예: INHA-REST-PRIV-02)"
                  class="flex-1 min-w-0 px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-[12px] text-white placeholder-white/50" />
                <button onclick="submitManualQrCode()" class="px-3.5 py-2 rounded-xl bg-[#34D399] text-[#0D3D2E] font-extrabold text-[12px]">확인</button>
              </div>
            `}

            <div class="bg-white/10 rounded-3xl p-4 space-y-2">
              <div class="text-[12.5px] font-extrabold text-[#A7F3D0]">공간별 QR 스캔 시뮬레이션</div>
              <div class="grid grid-cols-2 gap-2">
                ${state.spaces.map(sp => {
                  const vac = getVacancy(sp);
                  return `
                    <button onclick="performQrCheckIn('${sp.id}')" class="p-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-left border border-white/10">
                      <div class="text-[12px] font-bold truncate">${sp.name}</div>
                      <div class="text-[10px] ${vac === 0 ? 'text-[#FCA5A5]' : 'text-[#A7F3D0]'}">${vac === 0 ? '만석 (제한)' : `빈자리 ${vac}석 · 체크인`}</div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ==================== REPORT & ROBOT SCREENS ====================
    function renderReportScreen() {
      return `
        <div class="w-full h-full bg-[#F4F6F3] flex flex-col">
          <header class="bg-white border-b border-[#E5ECE8] px-4 py-3.5 flex items-center gap-3 shrink-0">
            <button onclick="state.screen = 'main'; render();" class="w-9 h-9 rounded-xl hover:bg-[#F4F6F3] flex items-center justify-center text-[#12503D]">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <h2 class="text-[16.5px] font-extrabold">민원 신고</h2>
          </header>
          <div class="scroll-area px-4 py-5 space-y-5">
            <div><h3 class="text-[21px] font-extrabold text-[#12503D]">불편한 점을 알려주세요</h3><p class="text-[12.5px] text-[#6B7E75] mt-1">관리팀이 확인하고 처리 상황을 알려드려요</p></div>
            <div><p class="text-[13px] font-bold mb-2">어느 공간인가요?</p><div class="flex flex-wrap gap-2">${state.spaces.map(sp => `<button onclick="state.reportForm.spaceId = '${sp.id}'; render();" class="px-3.5 py-2 rounded-full text-[12.5px] font-bold border ${state.reportForm.spaceId === sp.id ? 'bg-[#12503D] text-white border-[#12503D]' : 'bg-white border-[#DCE5DF]'}">${sp.name}</button>`).join('')}</div></div>
            <div><p class="text-[13px] font-bold mb-2">어떤 문제인가요?</p><div class="flex flex-wrap gap-2">${ISSUE_TYPES.map(issue => `<button onclick="state.reportForm.issueType = '${issue}'; render();" class="px-3.5 py-2 rounded-full text-[12.5px] font-bold border ${state.reportForm.issueType === issue ? 'bg-[#12503D] text-white border-[#12503D]' : 'bg-white border-[#DCE5DF]'}">${issue}</button>`).join('')}</div></div>
            <textarea rows="4" oninput="state.reportForm.detail = this.value" placeholder="예) 마사지체어 2번 좌석이 작동하지 않아요" class="w-full p-3.5 rounded-2xl bg-white border border-[#DCE5DF] text-[13.5px] resize-none">${state.reportForm.detail}</textarea>
            <label class="block w-full py-3.5 rounded-2xl border-2 border-dashed border-[#C8D3CC] bg-white text-center cursor-pointer"><input type="file" accept="image/*" class="hidden" onchange="state.reportForm.photoName = this.files[0] ? this.files[0].name : ''; render();" /><span class="text-[13px] font-bold text-[#495B52]">${state.reportForm.photoName ? `📎 ${state.reportForm.photoName}` : '📷 사진 첨부하기'}</span></label>
            <button onclick="submitReport()" class="w-full py-4 rounded-2xl bg-[#12503D] text-white font-bold text-[15px]">민원 접수하기</button>
          </div>
        </div>
      `;
    }

    function renderRobotScreen() {
      const count = state.robotForm.selectedSupplies.length;
      const isDispatching = state.robotForm.status === 'dispatching';
      const isArrived = state.robotForm.status === 'arrived';
      const etaMin = Math.max(1, Math.ceil(state.robotForm.etaSeconds / 60));
      return `
        <div class="w-full h-full bg-[#F4F6F3] flex flex-col">
          <header class="bg-white border-b border-[#E5ECE8] px-4 py-3.5 flex items-center gap-3 shrink-0">
            <button onclick="state.screen = 'main'; render();" class="w-9 h-9 rounded-xl hover:bg-[#F4F6F3] flex items-center justify-center text-[#12503D]">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <h2 class="text-[16.5px] font-extrabold">로봇 호출</h2>
          </header>
          <div class="scroll-area px-4 py-5 space-y-5">
            <div><h3 class="text-[21px] font-extrabold text-[#12503D]">필요한 용품을 골라주세요</h3><p class="text-[12.5px] text-[#6B7E75] mt-1">로봇이 내가 있는 자리까지 가져다줘요</p></div>
            <div class="bg-white rounded-2xl p-3.5 border border-[#E2EAE5] flex items-center justify-between">
              <div><div class="text-[11px] text-[#6B7E75]">배달 받을 위치</div><div class="text-[14.5px] font-extrabold">${state.robotForm.locationText}</div></div>
              <button onclick="state.modal = 'robotLocation'; render();" class="px-3 py-1.5 rounded-xl text-[12.5px] font-bold text-[#12503D]">변경</button>
            </div>
            <div class="grid grid-cols-2 gap-2.5">${SUPPLY_ITEMS.map(item => {
              const active = state.robotForm.selectedSupplies.includes(item.id);
              return `<button onclick="toggleSupply('${item.id}')" class="rounded-2xl p-3.5 border-2 flex items-center justify-between text-left ${active ? 'bg-[#EAF4EE] border-[#12503D] text-[#12503D]' : 'bg-white border-[#E2EAE5]'}"><span class="text-[13.5px] font-bold">${item.name}</span><span class="w-6 h-6 rounded-full flex items-center justify-center text-[12px] font-bold ${active ? 'bg-[#12503D] text-white' : 'bg-[#D6DED9] text-white'}">${active ? '✓' : '+'}</span></button>`;
            }).join('')}</div>
            <div class="rounded-2xl p-4 flex items-center gap-3.5 ${isDispatching ? 'bg-[#FDF4E3] border border-[#E8B968]' : isArrived ? 'bg-[#E7F5EE] border border-[#86C9A6]' : 'bg-[#E9F2ED]'}">
              <div class="w-11 h-11 rounded-2xl bg-[#12503D] text-white flex items-center justify-center font-extrabold shrink-0">R2</div>
              <div><div class="text-[14px] font-extrabold text-[#12503D]">${isDispatching ? '로봇 R-02 이동 중' : isArrived ? '로봇 R-02 도착 완료' : '로봇 R-02 대기 중'}</div><div class="text-[12px] text-[#4C5E55]">${isDispatching ? `약 ${etaMin}분 뒤 도착해요` : isArrived ? '선택한 용품을 수령해 주세요!' : '호출하면 약 3분 뒤에 도착해요'}</div></div>
            </div>
            <button onclick="callRobot()" class="w-full py-4 rounded-2xl font-bold text-[15px] ${isDispatching ? 'bg-[#D97706] text-white' : 'bg-[#12503D] text-white'}">${isDispatching ? '로봇 호출 취소하기' : `로봇 호출하기 (${count}개)`}</button>
          </div>
        </div>
      `;
    }

    // ==================== PRESENTATION DEMO DRAWER ====================
    function renderDemoPanel() {
      if (!state.demoOpen) return '';
      const nextStep = Math.min(9, state.demoCurrentStep + 1);
      return `
        <div class="absolute inset-x-0 bottom-14 top-14 bg-[#111916]/95 text-white z-30 flex flex-col p-4 overflow-hidden">
          <div class="flex items-center justify-between pb-3 border-b border-white/15">
            <div><div class="text-[14px] font-extrabold text-[#A7F3D0]">🎬 상황 인지형 UX 시연 모드</div><div class="text-[11px] text-white/70">공강 시작부터 체크아웃까지 9단계 시연</div></div>
            <button onclick="state.demoOpen = false; render();" class="px-2.5 py-1 rounded-lg bg-white/15 text-[12px] font-bold">닫기</button>
          </div>
          <div class="flex-1 overflow-y-auto space-y-1.5 py-3 no-scrollbar">
            ${DEMO_STEPS.map(s => `<button onclick="state.demoOpen = false; runDemoStep(${s.step});" class="w-full text-left p-2.5 rounded-xl border flex items-center gap-3 ${state.demoCurrentStep === s.step ? 'bg-[#12503D] border-[#34D399]' : 'bg-white/5 border-white/10'}"><span class="w-6 h-6 rounded-full bg-white/15 text-[11px] font-extrabold flex items-center justify-center shrink-0">${s.step}</span><div class="min-w-0"><div class="text-[12.5px] font-bold truncate">${s.title}</div><div class="text-[10.5px] text-white/70 truncate">${s.desc}</div></div></button>`).join('')}
          </div>
          <button onclick="state.demoOpen = false; runDemoStep(${nextStep});" class="w-full py-3 rounded-xl bg-[#34D399] text-[#0D3D2E] font-extrabold text-[13.5px]">다음 단계 실행 (Step ${nextStep}) →</button>
        </div>
      `;
    }

    // ==================== MODALS ====================
    function renderModal() {
      if (!state.modal) return '';
      if (state.modal === 'freeTime') {
        return `<div class="absolute inset-0 bg-black/45 z-40 flex items-center justify-center p-5" onclick="if(event.target===this){state.modal=null;render();}"><div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-xl"><h3 class="text-[17px] font-extrabold text-[#12503D]">공강 시간 설정</h3><input id="freeTimeInput" type="number" min="5" max="300" value="${getFreeMinutes()}" class="w-full px-4 py-3 rounded-2xl border border-[#DCE5DF] text-[16px] font-bold" /><div class="flex gap-2"><button onclick="state.modal = null; render();" class="flex-1 py-3 rounded-xl bg-[#F1F4F2] font-bold text-[13.5px]">취소</button><button onclick="const v = parseInt(document.getElementById('freeTimeInput').value, 10); if(v>0){state.freeTimeSeconds=v*60; state.totalGapSeconds=v*60; savePersistedState(); showToast('공강 시간이 ' + v + '분으로 설정되었어요.');} state.modal=null; render();" class="flex-1 py-3 rounded-xl bg-[#12503D] text-white font-bold text-[13.5px]">적용</button></div></div></div>`;
      }
      if (state.modal === 'gpsConsent') {
        return `<div class="absolute inset-0 bg-black/50 z-40 flex items-center justify-center p-5" onclick="if(event.target===this){state.modal=null;render();}"><div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-xl"><h3 class="text-[17px] font-extrabold text-[#12503D]">위치 정보 이용 동의</h3><p class="text-[12.5px] text-[#475850]">휴토피아 반경 35m 이내 도착을 감지하면 자동으로 QR 스캔 화면을 실행해요.</p><div class="flex gap-2"><button onclick="setGpsConsent('denied')" class="flex-1 py-3 rounded-xl bg-[#F1F4F2] font-bold text-[13px]">미동의 (수동)</button><button onclick="setGpsConsent('granted')" class="flex-1 py-3 rounded-xl bg-[#12503D] text-white font-bold text-[13px]">동의하고 확인</button></div></div></div>`;
      }
      if (state.modal === 'timetable') {
        return `<div class="absolute inset-0 bg-black/45 z-40 flex items-center justify-center p-4" onclick="if(event.target===this){state.modal=null;render();}"><div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-3 shadow-xl max-h-[85vh] overflow-y-auto"><div class="flex items-center justify-between"><h3 class="text-[17px] font-extrabold text-[#12503D]">개인 시간표 관리</h3><button onclick="state.modal = null; render();" class="text-[13px] font-bold text-[#6B7E75]">닫기</button></div><div class="space-y-2">${state.timetable.map(c => `<div class="p-3 rounded-xl bg-[#F4F6F4] flex items-center justify-between gap-2"><div><div class="text-[13.5px] font-bold">${c.name}${c.professor ? ` <span class="text-[11.5px] font-semibold text-[#12503D]">(${c.professor} 교수님)</span>` : ''}</div><div class="text-[11px] text-[#5E7369]">${c.startTime}~${c.endTime} · ${c.building}</div></div><button onclick="removeTimetableClass('${c.id}')" class="text-[11px] font-bold text-[#C93B3B]">삭제</button></div>`).join('')}</div><div class="pt-2 border-t space-y-2"><div class="grid grid-cols-2 gap-2"><input type="text" placeholder="수업명" value="${state.newClassForm.name}" oninput="state.newClassForm.name=this.value" class="px-3 py-2 rounded-xl border text-[12.5px]" /><input type="text" placeholder="교수님" value="${state.newClassForm.professor}" oninput="state.newClassForm.professor=this.value" class="px-3 py-2 rounded-xl border text-[12.5px]" /></div><div class="grid grid-cols-2 gap-2"><input type="text" placeholder="시작 (15:30)" value="${state.newClassForm.startTime}" oninput="state.newClassForm.startTime=this.value" class="px-3 py-2 rounded-xl border text-[12.5px]" /><input type="text" placeholder="강의실" value="${state.newClassForm.building}" oninput="state.newClassForm.building=this.value" class="px-3 py-2 rounded-xl border text-[12.5px]" /></div><button onclick="addTimetableClass()" class="w-full py-2.5 rounded-xl bg-[#12503D] text-white font-bold text-[13px]">수업 추가하기</button></div></div></div>`;
      }
      if (state.modal === 'notifications') {
        return `<div class="absolute inset-0 bg-black/45 z-40 flex items-center justify-center p-4" onclick="if(event.target===this){state.modal=null;render();}"><div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-3 shadow-xl max-h-[80vh] flex flex-col"><div class="flex items-center justify-between"><h3 class="text-[17px] font-extrabold text-[#12503D]">알림함</h3><button onclick="state.notifications.forEach(n=>n.unread=false); render();" class="text-[11.5px] font-bold text-[#12503D]">모두 읽음</button></div><div class="overflow-y-auto space-y-2 flex-1">${state.notifications.map(n => `<button onclick="handleNotificationClick('${n.id}')" class="w-full text-left p-3 rounded-2xl ${n.unread ? 'bg-[#EBF5EF] border border-[#C6E3D2]' : 'bg-[#F6F8F6]'}"><div class="flex justify-between gap-2"><span class="text-[12.5px] font-bold text-[#12503D]">${n.title}</span><span class="text-[10px] text-[#6B7E75] shrink-0">${n.time}</span></div><p class="text-[11.5px] text-[#4C5E55] mt-1">${n.body}</p></button>`).join('')}</div><button onclick="state.modal = null; render();" class="w-full py-2.5 rounded-xl bg-[#12503D] text-white font-bold text-[13px]">닫기</button></div></div>`;
      }
      if (state.modal === 'myLocation') {
        const options = [ENTRANCE_POS, ...state.spaces];
        return `<div class="absolute inset-0 bg-black/45 z-40 flex items-center justify-center p-5" onclick="if(event.target===this){state.modal=null;render();}"><div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-3 shadow-xl"><h3 class="text-[17px] font-extrabold text-[#12503D]">내 위치 설정</h3><div class="space-y-1.5 max-h-64 overflow-y-auto">${options.map(opt => `<button onclick="state.myLocationId = '${opt.id}'; state.modal = null; showToast('내 위치가 설정되었습니다.');" class="w-full px-3.5 py-2.5 rounded-xl text-left text-[13.5px] font-bold ${state.myLocationId === opt.id ? 'bg-[#12503D] text-white' : 'bg-[#F4F6F4]'}">${opt.name}</button>`).join('')}</div></div></div>`;
      }
      if (state.modal === 'alerts') {
        return `<div class="absolute inset-0 bg-black/45 z-40 flex items-center justify-center p-5" onclick="if(event.target===this){state.modal=null;render();}"><div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-3 shadow-xl"><h3 class="text-[17px] font-extrabold text-[#12503D]">빈자리 알림 관리</h3><div class="space-y-2 max-h-64 overflow-y-auto">${state.spaces.map(sp => { const on = state.alertSpaceIds.includes(sp.id); return `<div class="flex items-center justify-between p-3 rounded-xl bg-[#F5F7F5]"><div><div class="text-[13.5px] font-bold">${sp.name}</div><div class="text-[11.5px] text-[#6B7E75]">${getCongestion(sp).text}</div></div><button onclick="toggleAlert('${sp.id}')" class="px-3 py-1.5 rounded-xl text-[12px] font-bold ${on ? 'bg-[#12503D] text-white' : 'bg-white border'}">${on ? '알림중' : '끄기'}</button></div>`; }).join('')}</div><button onclick="state.modal = null; render();" class="w-full py-3 rounded-xl bg-[#12503D] text-white font-bold text-[13.5px]">확인</button></div></div>`;
      }
      if (state.modal === 'robotLocation') {
        return `<div class="absolute inset-0 bg-black/45 z-40 flex items-center justify-center p-5" onclick="if(event.target===this){state.modal=null;render();}"><div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-3 shadow-xl"><h3 class="text-[17px] font-extrabold text-[#12503D]">배달 받을 위치 변경</h3><div class="space-y-1.5 max-h-64 overflow-y-auto">${state.spaces.map((sp, idx) => { const locStr = `${sp.name} · ${(idx % 3) + 1}번 좌석`; return `<button onclick="state.robotForm.locationText = '${locStr}'; state.modal = null; showToast('배달 위치가 변경되었습니다.');" class="w-full px-3.5 py-2.5 rounded-xl text-left text-[13.5px] font-bold bg-[#F4F6F4]">${locStr}</button>`; }).join('')}</div></div></div>`;
      }
      if (state.modal === 'logoutConfirm') {
        return `<div class="absolute inset-0 bg-black/45 z-40 flex items-center justify-center p-5" onclick="if(event.target===this){state.modal=null;render();}"><div class="bg-white rounded-3xl w-full max-w-xs p-5 space-y-4 shadow-xl text-center"><h3 class="text-[16.5px] font-extrabold">로그아웃할까요?</h3><div class="flex gap-2"><button onclick="state.modal = null; render();" class="flex-1 py-2.5 rounded-xl bg-[#F1F4F2] font-bold text-[13px]">취소</button><button onclick="state.modal = null; state.screen = 'login'; render();" class="flex-1 py-2.5 rounded-xl bg-[#C93B3B] font-bold text-[13px] text-white">로그아웃</button></div></div></div>`;
      }
      return '';
    }

    // ==================== SCROLL-PRESERVING & PARTIAL UPDATE RENDER ====================
    function renderPreservingScroll() {
      const scroller = document.querySelector('.scroll-area');
      const prevTop = scroller ? scroller.scrollTop : 0;
      render();
      const nextScroller = document.querySelector('.scroll-area');
      if (nextScroller) nextScroller.scrollTop = prevTop;
    }

    function updateCountdownDOMOnly() {
      const freeMin = getFreeMinutes();
      document.querySelectorAll('[data-countdown="min"]').forEach(el => {
        el.textContent = `${freeMin}분`;
      });
      document.querySelectorAll('[data-countdown="sec"]').forEach(el => {
        el.textContent = formatCountdown(state.freeTimeSeconds);
      });
      const ringEl = document.querySelector('[data-countdown="ring"]');
      if (ringEl && state.activeCheckIn) {
        const total = Math.max(60, state.activeCheckIn.totalRestSeconds || 3300);
        const pct = Math.min(1, Math.max(0, state.freeTimeSeconds / total));
        const circ = 2 * Math.PI * 52;
        ringEl.setAttribute('stroke-dashoffset', (circ * (1 - pct)).toFixed(1));
      }
    }

    function render() {
      const root = document.getElementById('app');
      let html = '';

      if (state.screen === 'splash') html = renderSplash();
      else if (state.screen === 'login') html = renderLogin();
      else if (state.screen === 'qr') html = renderQrScreen();
      else if (state.screen === 'report') html = renderReportScreen();
      else if (state.screen === 'robot') html = renderRobotScreen();
      else {
        html = `
          ${renderHeader()}
          <main class="scroll-area">
            ${state.activeTab === 'home' ? renderHomeTab() : state.activeTab === 'map' ? renderMapTab() : state.activeTab === 'friends' ? renderFriendsTab() : renderProfileTab()}
          </main>
          ${renderBottomNav()}
          ${renderDemoPanel()}
        `;
      }

      html += renderModal();
      if (state.toast) {
        html += `<div id="app-toast" class="toast-enter fixed sm:absolute bottom-20 left-1/2 -translate-x-1/2 z-50 bg-[#1A2420]/95 text-white px-4 py-2.5 rounded-full text-[12px] font-semibold shadow-lg whitespace-nowrap max-w-[92%] truncate">${state.toast}</div>`;
      }
      root.innerHTML = html;
    }

    // 1초마다 모든 화면 공강 카운트다운 + 친구 공강 시간 경과 (스크롤 초기화 없이 DOM 부분 갱신)
    setInterval(() => {
      if (state.screen !== 'splash' && state.screen !== 'login') {
        if (state.freeTimeSeconds > 0) {
          const prevMode = getContextMode();
          state.freeTimeSeconds -= 1;
          const nextMode = getContextMode();

          if (state.activeCheckIn && state.freeTimeSeconds === state.user.classAlertBeforeMin * 60) {
            simulateClassAlert();
          } else if (prevMode !== nextMode) {
            renderPreservingScroll();
          } else {
            updateCountdownDOMOnly();
          }
        }
        // 친구 공강 시간도 함께 경과
        state.friends.forEach(f => {
          if (f.remainingFreeSeconds > 0) f.remainingFreeSeconds -= 1;
        });
      }
    }, 1000);

    // 10초마다 실시간 혼잡도 자동 변동 (스크롤 위치 유지)
    setInterval(() => {
      if (state.autoSimEnabled && state.screen === 'main' && !state.modal && !state.demoOpen) {
        simulateSeatChange();
      }
    }, 10000);

    loadPersistedState();
    render();
  </script>
</body>
</html>
